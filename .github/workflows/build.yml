name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Il runner Ubuntu di GitHub include già l'Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/svegliami.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/svegliami.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Segreto SIGNING_KEYSTORE_BASE64 mancante: APK con firma temporanea, non verrà pubblicato"
          fi

      - name: Test e build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: svegliami-apk
          path: app/build/outputs/apk/debug/*.apk

      # Pacchetto per Google Play (AAB firmato con la chiave di caricamento).
      - uses: actions/upload-artifact@v4
        with:
          name: svegliami-aab
          path: app/build/outputs/bundle/release/*.aab

      # Su main: pubblica l'APK come release "apk", con link diretto e fisso:
      # https://github.com/<utente>/<repo>/releases/download/apk/svegliami.apk
      - name: Pubblica l'APK come release
        # Solo con la chiave fissa: altrimenti l'APK non si installerebbe sopra il precedente.
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk svegliami.apk
          cp app/build/outputs/bundle/release/app-release.aab svegliami.aab
          gh release delete apk --cleanup-tag --yes || true
          gh release create apk svegliami.apk svegliami.aab \
            --title "Svegliami (ultima build)" \
            --notes "Build automatica n. $GITHUB_RUN_NUMBER del commit ${GITHUB_SHA::7}. svegliami.apk si installa sul telefono, svegliami.aab si carica su Google Play." \
            --target "$GITHUB_SHA"
